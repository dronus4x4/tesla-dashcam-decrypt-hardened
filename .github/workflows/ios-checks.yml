name: iOS native checks
on:
  push:
    branches: [main, ios-app]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Install fixture dependencies
        working-directory: source
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Native protocol tests and unsigned iOS build
        working-directory: source
        run: |
          xcodebuild -version
          TESLA_TEST_PYTHON="$PWD/.venv/bin/python" bash ios/scripts/check.sh
